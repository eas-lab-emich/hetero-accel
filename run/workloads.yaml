---
# Setting workloads according to: https://arxiv.org/abs/2210.14657
# and the MLPerf suite: https://github.com/mlcommons/inference

workloads:
  ClassifiersA:
    - arch: vgg11
      dataset: cifar10
      pretrained: false
      resumed_checkpoint_path: null
      batch_print_frequency: 100
    - arch: resnet18
      dataset: cifar10
      pretrained: true
      resumed_checkpoint_path: null
      batch_print_frequency: 100
    - arch: vgg16
      dataset: cifar10
      pretrained: true
      resumed_checkpoint_path: null
      batch_print_frequency: 100
    - arch: resnet50
      dataset: cifar100
      pretrained: true
      resumed_checkpoint_path: null
      batch_print_frequency: 100
    - arch: mobilenet
      dataset: cifar100
      pretrained: true
      resumed_checkpoint_path: null
      batch_print_frequency: 100
    - arch: inception_v3
      dataset: imagenet
      pretrained: true
      resumed_checkpoint_path: null
      batch_print_frequency: 100

  ClassifiersB:
    - arch: vgg13
      dataset: cifar10
      pretrained: true
      resumed_checkpoint_path: null
      batch_print_frequency: 100
    - arch: resnet34
      dataset: cifar10
      pretrained: true
      resumed_checkpoint_path: null
      batch_print_frequency: 100
    - arch: vgg19
      dataset: cifar10
      pretrained: true
      resumed_checkpoint_path: null
      batch_print_frequency: 100
    - arch: mobilenetv2
      dataset: cifar100
      pretrained: true
      resumed_checkpoint_path: null
      batch_print_frequency: 100
    - arch: resnet50
      dataset: cifar100
      pretrained: true
      resumed_checkpoint_path: null
      batch_print_frequency: 100
    - arch: googlenet
      dataset: imagenet
      pretrained: true
      resumed_checkpoint_path: null
      batch_print_frequency: 100